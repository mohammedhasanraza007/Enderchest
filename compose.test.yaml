# The TEST stack (docs/DATA_SAFETY.md 8). Never shares a volume, folder or port with the live stack.
# Remove its containers with:  docker compose -p enderchest-test -f compose.test.yaml rm -sf
# Reset its data with POST /api/v1/test/reset, never by deleting the volume.
name: enderchest-test

services:
  app:
    image: enderchest-app:latest
    build:
      context: .
      target: runtime
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${ENDERCHEST_TEST_PORT:-8471}:8470"
    environment:
      ENDERCHEST_ENV: test
      ENDERCHEST_PORT: ${ENDERCHEST_TEST_PORT:-8471}
      ENDERCHEST_BACKUP_DIR: ./.test-backups
    volumes:
      - enderchest_test_data:/data
      - ./.test-backups:/backups
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8470/health', headers={'Host': '127.0.0.1:' + os.environ.get('ENDERCHEST_PORT', '8470')}), timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # dev.bat: the same test app with the source mounted and uvicorn --reload. Never the live volume.
  dev:
    profiles: ["dev"]
    image: enderchest-app:latest
    build:
      context: .
      target: runtime
    init: true
    ports:
      - "127.0.0.1:${ENDERCHEST_TEST_PORT:-8471}:8470"
    environment:
      ENDERCHEST_ENV: test
      ENDERCHEST_PORT: ${ENDERCHEST_TEST_PORT:-8471}
      ENDERCHEST_BACKUP_DIR: ./.test-backups
    volumes:
      - enderchest_test_data:/data
      - ./.test-backups:/backups
      - ./backend/app:/app/app
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8470", "--reload", "--reload-dir", "/app/app"]

  # Lint, unit and integration tests. Run through test.bat; uses temporary folders, no volumes.
  tools:
    profiles: ["tools"]
    build:
      context: .
      target: tools
    image: enderchest-tools:latest
    working_dir: /app
    volumes:
      - ./test-results:/app/test-results

volumes:
  enderchest_test_data:
    name: ${ENDERCHEST_TEST_VOLUME:-enderchest_test_data}
