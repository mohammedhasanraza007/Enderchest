<!doctype html>
<html lang="en" data-theme-pref="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enderchest</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="stylesheet" href="/tokens.css" />
    <!-- Sets data-theme before first paint, so there is no flash. The server writes the stored
         preference into data-theme-pref; "system" follows the operating system. -->
    <script>
      (function () {
        var root = document.documentElement;
        var pref = root.getAttribute("data-theme-pref") || "system";
        var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        root.setAttribute("data-theme", pref === "system" ? (dark ? "dark" : "light") : pref);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
