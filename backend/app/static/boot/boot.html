<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enderchest</title>
<link rel="stylesheet" href="/tokens.css">
<!-- No database may exist here, so the stored theme is unknown: this page follows the system. -->
<script>
  document.documentElement.setAttribute("data-theme",
    window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
</script>
<style>
  /* Same tokens as the app (/tokens.css). Each var() has the dark value as a fallback, so the page
     is still readable if the app files are missing from a build. */
  html { background: var(--bg-base, #16110d); }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: var(--text, #fffaf0);
         font: 16px/1.5 var(--font-sans, system-ui, sans-serif); }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
                 background: radial-gradient(70vw circle at 100% 10%, var(--bg-glow-corner, #4c392b), transparent 70%); }
  .boot { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 32px 0; }
  .boot img { display: block; }
  main { width: min(640px, calc(100vw - 32px)); padding: 28px; box-sizing: border-box;
         border: 1px solid var(--hairline-card, rgba(255, 243, 226, .3)); border-radius: var(--radius-card, 24px);
         background: linear-gradient(180deg, var(--surface-card-top, #6b5b4f), var(--surface-card-bottom, #4e4138));
         box-shadow: var(--shadow-card, 0 24px 60px rgba(0, 0, 0, .35)); }
  :root[data-theme="light"] main { border-radius: 52px; padding: 32px 40px; }
  h1 { margin: 0 0 8px; font: 450 1.75rem/1.15 var(--font-display, Georgia, serif); }
  p { margin: 8px 0; }
  .muted { color: var(--text-muted-glass, #e3dacf); font-size: 14px; }
  ul { list-style: none; padding: 0; margin: 16px 0; }
  li { margin: 6px 0; padding: 10px 16px; border: 1px solid var(--hairline-panel, rgba(255, 243, 226, .18));
       border-radius: var(--radius-panel, 18px); background: var(--surface-panel, #67594e); }
  label { display: block; cursor: pointer; }
  input[type=radio] { accent-color: var(--cream-fill, #fdecda); }
  input::placeholder { color: var(--text-muted-glass, #e3dacf); opacity: 1; }
  input[type=text] { width: 100%; box-sizing: border-box; min-height: 44px; padding: 0 20px; margin: 8px 0;
                     background: var(--surface-input, #75665b); color: var(--text, #fffaf0);
                     border: 1px solid var(--hairline-pill, rgba(255, 243, 226, .22)); border-radius: 9999px; }
  button { min-height: 38px; padding: 0 24px; border-radius: 9999px; border: 1px solid transparent;
           background: var(--cream-fill, #fdecda); color: var(--on-cream, #2a1a12); font: inherit; cursor: pointer; }
  button.secondary { background: var(--surface-pill, #75665b); color: var(--text, #fffaf0);
                     border-color: var(--hairline-pill, rgba(255, 243, 226, .22)); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--focus-ring, #fffaf0); outline-offset: 2px; }
  /* Problems are said in words on a panel, never as coloured text on glass (DESIGN.md 4.5). */
  .error { padding: 10px 16px; border: 1px solid var(--danger-border, #e07a6c);
           border-radius: var(--radius-panel, 18px); background: var(--surface-panel, #67594e); }
  .error:empty { display: none; }
  details { margin-top: 20px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="boot">
<img src="/enderchest-logo.svg" width="72" height="72" alt="Enderchest" onerror="this.remove()">
<main id="root" aria-live="polite"><h1>Enderchest</h1><p>Checking your data…</p></main>
</div>
<script>
"use strict";
const root = document.getElementById("root");
const TITLES = {
  no_data_volume: "The data volume is not connected",
  data_not_writable: "The data volume cannot be written to",
  second_instance: "Enderchest is already running",
  env_mismatch: "This data belongs to a different setup",
  newer_data: "This data is from a newer version",
  corrupt: "The database needs attention",
  database_missing: "We found existing backups",
  backup_folder_unavailable: "An update is waiting for the backup folder",
  pre_migration_backup_failed: "The backup before updating failed",
  migration_failed: "The update failed and was undone",
  unexpected_error: "Enderchest could not start",
};

function el(tag, text, cls) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (cls) node.className = cls;
  return node;
}

async function post(path, body) {
  const response = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Enderchest": "1" },
    body: JSON.stringify(body),
  });
  const data = await response.json();
  if (!response.ok) throw new Error(data.error ? data.error.message : "The request failed.");
  return data;
}

function recoveryView(boot) {
  const box = el("div");
  box.append(el("p", boot.message || ""));
  if (!boot.backups_mounted) {
    box.append(el("p", "The backup folder is not connected, so nothing can be restored yet.", "error"));
  }
  const list = el("ul");
  boot.backups.forEach((backup, index) => {
    const row = el("li");
    const label = el("label");
    const radio = document.createElement("input");
    radio.type = "radio"; radio.name = "backup"; radio.value = backup.name;
    radio.checked = index === 0;
    const when = new Date(backup.at).toLocaleString();
    label.append(radio, " " + when + " — " + backup.kind + ", " + Math.round(backup.bytes / 1024) + " KB");
    row.append(label);
    list.append(row);
  });
  box.append(list);

  const typed = document.createElement("input");
  typed.type = "text"; typed.placeholder = "Type RESTORE to confirm"; typed.autocomplete = "off";
  const restore = el("button", "Restore this backup");
  const message = el("p", "", "error");
  restore.addEventListener("click", async () => {
    const chosen = document.querySelector("input[name=backup]:checked");
    if (!chosen) { message.textContent = "Choose a backup first."; return; }
    restore.disabled = true;
    try {
      await post("/api/v1/boot/restore", { name: chosen.value, confirm: typed.value });
      location.reload();
    } catch (error) { message.textContent = error.message; restore.disabled = false; }
  });
  if (boot.backups.length) box.append(typed, restore);

  const details = el("details");
  details.append(el("summary", "Start empty anyway"));
  details.append(el("p", "A safety copy of whatever is on disk is made first. Existing files are moved aside, never deleted.", "muted"));
  const typedEmpty = document.createElement("input");
  typedEmpty.type = "text"; typedEmpty.placeholder = "Type START EMPTY to confirm"; typedEmpty.autocomplete = "off";
  const empty = el("button", "Start empty", "secondary");
  empty.addEventListener("click", async () => {
    empty.disabled = true;
    try {
      await post("/api/v1/boot/start-empty", { confirm: typedEmpty.value });
      location.reload();
    } catch (error) { message.textContent = error.message; empty.disabled = false; }
  });
  details.append(typedEmpty, empty);
  box.append(details, message);
  return box;
}

function render(boot) {
  root.replaceChildren();
  if (boot.state === "ok") { location.reload(); return; }
  if (boot.state === "starting") {
    root.append(el("h1", "Starting…"), el("p", "Checking your data. This takes a few seconds.", "muted"));
    return;
  }
  root.append(el("h1", TITLES[boot.reason] || "Enderchest needs attention"));
  if (boot.state === "recovery") { root.append(recoveryView(boot)); return; }
  root.append(el("p", boot.message || ""));
  root.append(el("p", "Your data has not been changed or deleted.", "muted"));
}

async function poll() {
  try {
    const response = await fetch("/api/v1/boot");
    const boot = await response.json();
    // Re-rendering would wipe what the owner is typing on the recovery page.
    const typing = document.activeElement && document.activeElement.tagName === "INPUT";
    if (!(boot.state === "recovery" && root.dataset.state === "recovery") && !typing) {
      render(boot);
    }
    root.dataset.state = boot.state;
    if (boot.state !== "starting") return;
  } catch (error) {
    root.replaceChildren(el("h1", "Enderchest is not answering"),
      el("p", "The app may still be starting. This page will keep trying.", "muted"));
  }
  setTimeout(poll, 1500);
}
poll();
</script>
</body>
</html>
